<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Linear Inequalities</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --secondary: #0284c7;
      --secondary-hover: #0369a1;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --success: #16a34a;
      --error: #dc2626;
      --disabled: #94a3b8;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 1100px;
      padding: 30px;
      position: relative;
    }

    .user-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .user-header label {
      font-weight: bold;
      font-size: 0.95rem;
    }

    .user-header input {
      max-width: 250px;
      padding: 6px 12px;
    }

    h1 {
      text-align: center;
      color: var(--primary);
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .difficulty-section {
      margin-bottom: 25px;
      background: #f1f5f9;
      padding: 15px;
      border-radius: 8px;
    }

    .difficulty-labels {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .difficulty-labels span {
      flex: 1;
      text-align: center;
      color: var(--disabled);
      cursor: pointer;
    }

    .difficulty-labels span.active {
      color: var(--primary);
    }

    .slider {
      width: 100%;
      appearance: none;
      height: 8px;
      border-radius: 5px;
      background: #cbd5e1;
      outline: none;
    }

    .slider::-webkit-slider-thumb {
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
    }

    .workspace-layout {
      display: flex;
      gap: 25px;
      align-items: stretch;
      margin-bottom: 20px;
    }

    .left-column {
      flex: 1.2;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .right-column {
      flex: 0.8;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 850px) {
      .workspace-layout {
        flex-direction: column;
      }
    }

    button {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-bottom: 20px;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:disabled {
      background-color: var(--disabled) !important;
      cursor: not-allowed !important;
    }

    .btn-secondary {
      background-color: var(--secondary);
      margin-top: 15px;
      margin-bottom: 0;
    }

    .btn-secondary:hover {
      background-color: var(--secondary-hover);
    }

    .question-box {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .question-prompt {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 10px;
    }

    .equation-display {
      font-size: 1rem;
      line-height: 1.6;
    }

    .graph-container {
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
      aspect-ratio: 4 / 1;
    }

    svg {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      border-radius: 8px;
      overflow: visible;
    }

    .draw-section {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .draw-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .draw-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--text);
    }

    .draw-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .draw-btn {
      width: auto;
      padding: 4px 10px;
      margin-bottom: 0;
      font-size: 0.8rem;
      background-color: #e2e8f0;
      color: var(--text);
    }

    .draw-btn:hover {
      background-color: #cbd5e1;
    }

    .canvas-container {
      width: 100%;
      flex: 1;
      min-height: 320px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: #ffffff;
      touch-action: none;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 8px;
      cursor: crosshair;
    }

    canvas.disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .print-draw-image {
      display: none;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .input-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
    }

    .part-block {
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 12px 15px;
      border-radius: 8px;
    }

    .part-title {
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 0.95rem;
      color: var(--primary);
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .input-row:last-child {
      margin-bottom: 0;
    }

    .input-label {
      font-size: 0.95rem;
      font-weight: bold;
      white-space: nowrap;
    }

    select, input[type="text"] {
      padding: 8px 12px;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
    }

    select {
      background-color: white;
      cursor: pointer;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--primary);
    }

    input[type="text"]:disabled, select:disabled {
      background-color: #f1f5f9;
      color: #64748b;
      cursor: not-allowed;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .choice-btn {
      flex: 1;
      padding: 8px;
      margin-bottom: 0;
      background-color: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
    }

    .choice-btn:hover {
      background-color: #f1f5f9;
    }

    .choice-btn.selected {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .feedback {
      border-radius: 8px;
      padding: 15px;
      display: none;
    }

    .feedback.correct {
      display: block;
      background-color: #dcfce7;
      border: 1px solid #bbf7d0;
      color: #15803d;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .feedback.incorrect {
      display: block;
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .feedback-heading {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 10px;
      color: var(--error);
    }

    .solution-line-block {
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
    }

    .solution-line-title {
      font-weight: bold;
      font-size: 1.05rem;
      margin-bottom: 10px;
    }

    .math-working {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      line-height: 1.7;
      background: #f8fafc;
      padding: 10px;
      border-radius: 6px;
      border-left: 3px solid var(--primary);
      margin-top: 10px;
    }

    .student-answer-summary {
      display: none;
      font-size: 1rem;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .number-line-interactive {
      cursor: pointer;
      user-select: none;
    }

    @media print {
      body {
        background-color: #ffffff;
        padding: 0;
      }

      .container {
        box-shadow: none;
        border: none;
        max-width: 100%;
        padding: 0;
      }

      .workspace-layout {
        display: block;
      }

      .user-header,
      .difficulty-section,
      #generateBtn,
      #submitBtn,
      #savePdfBtn,
      .input-section,
      .draw-controls {
        display: none !important;
      }

      .student-answer-summary {
        display: block !important;
      }

      .question-box {
        border: 1px solid #cbd5e1;
      }

      .canvas-container {
        display: none !important;
      }

      .print-draw-image {
        display: block !important;
        margin-top: 15px;
        margin-bottom: 15px;
      }

      .feedback {
        display: block !important;
        border: 1px solid #cbd5e1;
        background-color: #f8fafc !important;
        color: #0f172a !important;
      }

      .feedback-heading {
        color: var(--error);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="user-header">
      <label for="userNameInput">Name:</label>
      <input type="text" id="userNameInput" placeholder="Enter your initials" />
    </div>

    <h1>Simple Linear Inequalities</h1>

    <div class="difficulty-section">
      <div class="difficulty-labels">
        <span id="labelBasic" class="active">Basic</span>
        <span id="labelInter" class="disabled" style="display:none;">Intermediate</span>
        <span id="labelAdvance" class="disabled">Advance</span>
      </div>
      <input type="range" min="1" max="1" value="1" class="slider" id="difficultySlider" disabled>
    </div>

    <button id="generateBtn">Generate Question</button>

    <div class="workspace-layout">
      <div class="left-column">
        <div class="question-box">
          <div class="question-prompt" id="questionPrompt">Click "Generate Question" to begin.</div>
          <div class="equation-display" id="equationDisplay"></div>
        </div>

        <div class="input-section" id="inputSection" style="display: none;">
          <!-- Dynamically populated -->
        </div>
      </div>

      <div class="right-column">
        <div class="draw-section" id="drawSection" style="display: none;">
          <div class="draw-header">
            <span class="draw-title">Working Space (Draw / Scratchpad):</span>
            <div class="draw-controls">
              <button type="button" class="draw-btn" id="undoDrawBtn">Undo</button>
              <button type="button" class="draw-btn" id="clearDrawBtn">Clear</button>
            </div>
          </div>
          <div class="canvas-container">
            <canvas id="workingCanvas"></canvas>
          </div>
          <img id="printDrawImage" class="print-draw-image" alt="Student Working Drawing" />
        </div>
      </div>
    </div>

    <div class="student-answer-summary" id="studentAnswerSummary"></div>
    <div class="feedback" id="feedbackBox"></div>
    <button id="savePdfBtn" class="btn-secondary" style="display: none;">Save PDF</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
    import { getFirestore, collection, addDoc, doc, setDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAd0olTVny--vwE9UVzh5YRDE7lzha6y08",
      authDomain: "qg-summary.firebaseapp.com",
      projectId: "qg-summary",
      storageBucket: "qg-summary.firebasestorage.app",
      messagingSenderId: "660515596494",
      appId: "1:660515596494:web:11d5aacc8c3937f452089f",
      measurementId: "G-5T9WWML4EK"
    };

    let db;
    try {
      const app = initializeApp(firebaseConfig);
      getAnalytics(app);
      db = getFirestore(app);
    } catch(e) {
      console.warn("Firebase initialization warning:", e);
    }

    window.recordCorrectSubmission = async function() {
      if (!db) return;
      const userNameInput = document.getElementById('userNameInput');
      const name = userNameInput.value.trim() || 'Anonymous';

      try {
        await addDoc(collection(db, "submissions"), {
          name: name,
          timestamp: serverTimestamp(),
          Chapter: 'Chap1.4'
        });

        const counterRef = doc(db, "counter", name);
        await setDoc(counterRef, {
          name: name,
          Chap1_4: increment(1),
          countTotal: increment(1)
        }, { merge: true });

      } catch (err) {
        console.error("Firebase write error:", err);
      }
    };
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let currentProblem = null;
      let isSubmitted = false;

      let studentBoundary = null;
      let studentClosed = false;
      let studentDirection = null;
      let studentPartBChoice = null;

      const generateBtn = document.getElementById('generateBtn');
      const questionPrompt = document.getElementById('questionPrompt');
      const equationDisplay = document.getElementById('equationDisplay');
      const inputSection = document.getElementById('inputSection');
      const feedbackBox = document.getElementById('feedbackBox');
      const savePdfBtn = document.getElementById('savePdfBtn');
      const studentAnswerSummary = document.getElementById('studentAnswerSummary');

      const drawSection = document.getElementById('drawSection');
      const canvas = document.getElementById('workingCanvas');
      const ctx = canvas.getContext('2d');
      const clearDrawBtn = document.getElementById('clearDrawBtn');
      const undoDrawBtn = document.getElementById('undoDrawBtn');
      const printDrawImage = document.getElementById('printDrawImage');

      let isDrawing = false;
      let strokeHistory = [];
      let currentStroke = [];

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          canvas.width = rect.width;
          canvas.height = rect.height;
          redrawCanvas();
        }
      }

      function getCanvasCoordinates(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      }

      function startDrawing(e) {
        if (isSubmitted) return;
        isDrawing = true;
        const pos = getCanvasCoordinates(e);
        currentStroke = [{ x: pos.x, y: pos.y }];
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      }

      function draw(e) {
        if (!isDrawing || isSubmitted) return;
        e.preventDefault();
        const pos = getCanvasCoordinates(e);
        currentStroke.push({ x: pos.x, y: pos.y });

        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#0f172a';

        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      }

      function stopDrawing() {
        if (!isDrawing) return;
        isDrawing = false;
        if (currentStroke.length > 0) {
          strokeHistory.push([...currentStroke]);
          currentStroke = [];
        }
      }

      function redrawCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#0f172a';

        strokeHistory.forEach(stroke => {
          if (stroke.length < 2) return;
          ctx.beginPath();
          ctx.moveTo(stroke[0].x, stroke[0].y);
          for (let i = 1; i < stroke.length; i++) {
            ctx.lineTo(stroke[i].x, stroke[i].y);
          }
          ctx.stroke();
        });
      }

      function clearCanvas() {
        if (isSubmitted) return;
        strokeHistory = [];
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      function undoCanvas() {
        if (isSubmitted) return;
        strokeHistory.pop();
        redrawCanvas();
      }

      function syncPrintImage() {
        printDrawImage.src = canvas.toDataURL('image/png');
      }

      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseleave', stopDrawing);

      canvas.addEventListener('touchstart', startDrawing, { passive: false });
      canvas.addEventListener('touchmove', draw, { passive: false });
      canvas.addEventListener('touchend', stopDrawing);

      clearDrawBtn.addEventListener('click', clearCanvas);
      undoDrawBtn.addEventListener('click', undoCanvas);
      window.addEventListener('resize', resizeCanvas);

      function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function getRandomChoice(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function reverseSign(sign) {
        const map = { '≥': '≤', '≤': '≥', '>': '<', '<': '>' };
        return map[sign] || sign;
      }

      function formatExpr(coeff, varName, constVal) {
        let res = "";
        if (coeff === 1) res += varName;
        else if (coeff === -1) res += `-${varName}`;
        else res += `${coeff}${varName}`;

        if (constVal > 0) res += ` + ${constVal}`;
        else if (constVal < 0) res += ` - ${Math.abs(constVal)}`;

        return res;
      }

      function renderNumberLineSVG(minVal, maxVal, state = null, isInteractive = false) {
        const viewBoxWidth = 500;
        const viewBoxHeight = 100;
        const padding = 40;
        const count = maxVal - minVal;
        const step = (viewBoxWidth - 2 * padding) / count;
        const yAxis = 65;

        let svgHtml = `<svg viewBox="0 0 ${viewBoxWidth} ${viewBoxHeight}" ${isInteractive ? 'class="number-line-interactive" id="interactiveNumberLineSVG"' : ''}>`;

        svgHtml += `
          <defs>
            <marker id="nlArrowRight" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
            </marker>
            <marker id="nlArrowLeft" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
            </marker>
            <marker id="axisArrowRight" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
            </marker>
            <marker id="axisArrowLeft" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
            </marker>
          </defs>
        `;

        svgHtml += `<line x1="${padding - 15}" y1="${yAxis}" x2="${viewBoxWidth - padding + 15}" y2="${yAxis}" stroke="#334155" stroke-width="2" marker-start="url(#axisArrowLeft)" marker-end="url(#axisArrowRight)" />`;

        for (let i = 0; i <= count; i++) {
          let val = minVal + i;
          let x = padding + i * step;

          svgHtml += `<line x1="${x}" y1="${yAxis - 6}" x2="${x}" y2="${yAxis + 6}" stroke="#334155" stroke-width="2" />`;
          svgHtml += `<text x="${x}" y="${yAxis + 22}" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">${val}</text>`;

          if (isInteractive) {
            svgHtml += `<rect x="${x - step / 2}" y="0" width="${step}" height="${viewBoxHeight}" fill="transparent" data-val="${val}" class="tick-click-target" />`;
          }
        }

        if (state && state.boundary !== null && state.boundary >= minVal && state.boundary <= maxVal) {
          const cx = padding + (state.boundary - minVal) * step;
          const cy = yAxis - 25;

          if (state.direction === 'left') {
            svgHtml += `<line x1="${cx}" y1="${cy}" x2="${padding - 10}" y2="${cy}" stroke="#dc2626" stroke-width="3" marker-end="url(#nlArrowLeft)" />`;
          } else if (state.direction === 'right') {
            svgHtml += `<line x1="${cx}" y1="${cy}" x2="${viewBoxWidth - padding + 10}" y2="${cy}" stroke="#dc2626" stroke-width="3" marker-end="url(#nlArrowRight)" />`;
          }

          svgHtml += `<line x1="${cx}" y1="${cy}" x2="${cx}" y2="${yAxis}" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,3" />`;

          if (state.closed) {
            svgHtml += `<circle cx="${cx}" cy="${cy}" r="7" fill="#dc2626" stroke="#dc2626" stroke-width="2.5" />`;
          } else {
            svgHtml += `<circle cx="${cx}" cy="${cy}" r="7" fill="#ffffff" stroke="#dc2626" stroke-width="2.5" />`;
          }
        }

        svgHtml += `</svg>`;
        return svgHtml;
      }

      function generateQuestionData() {
        const type = Math.random() < 0.5 ? 'A' : 'B';
        const signs = ['≥', '≤', '>', '<'];

        if (type === 'A') {
          const createPart = (var1, var2) => {
            const sign = getRandomChoice(signs);
            const coeff = getRandomChoice([-4, -3, -2, 2, 3, 4, 5]);
            const constVal = getRandomInt(-5, 5);
            const correctSign = coeff < 0 ? reverseSign(sign) : sign;
            return {
              givenSign: sign,
              coeff: coeff,
              constVal: constVal,
              expr1: formatExpr(coeff, var1, constVal),
              expr2: formatExpr(coeff, var2, constVal),
              correctSign: correctSign
            };
          };

          return {
            type: 'A',
            part1: createPart('a','b'),
            part2: createPart('x', 'y'),
            part3: createPart('p', 'q'),
            part4: createPart('m', 'n')
          };
        } else {
          const inequalitySign = getRandomChoice(signs);
          let boundary = getRandomInt(-4, 5);

          const formType = getRandomInt(1, 6);
          let lhsStr = "", rhsStr = "";
          let stepDetails = {};

          let a, b, c, rhsVal;

          if (formType === 1) {
            a = getRandomChoice([-4, -3, -2, 2, 3, 4, 5]);
            b = getRandomInt(1, 8);
            rhsVal = a * boundary + b;
            lhsStr = `${formatExpr(a, 'x', 0)} + ${b}`;
            rhsStr = `${rhsVal}`;
            stepDetails = {
              orig: `${lhsStr} ${inequalitySign} ${rhsStr}`,
              simplified: null,
              collected: `${formatExpr(a, 'x', 0)} ${inequalitySign} ${rhsVal} - ${b}`,
              isolated: `${formatExpr(a, 'x', 0)} ${inequalitySign} ${rhsVal - b}`,
              coeff: a
            };
          } else if (formType === 2) {
            a = getRandomChoice([-4, -3, -2, 2, 3, 4, 5]);
            b = getRandomInt(1, 8);
            rhsVal = a * boundary - b;
            lhsStr = `${formatExpr(a, 'x', 0)} - ${b}`;
            rhsStr = `${rhsVal}`;
            stepDetails = {
              orig: `${lhsStr} ${inequalitySign} ${rhsStr}`,
              simplified: null,
              collected: `${formatExpr(a, 'x', 0)} ${inequalitySign} ${rhsVal} + ${b}`,
              isolated: `${formatExpr(a, 'x', 0)} ${inequalitySign} ${rhsVal + b}`,
              coeff: a
            };
          } else if (formType === 3) {
            a = getRandomChoice([2, 3, 4]);
            c = getRandomChoice([1, 2, 3]);
            let r1 = getRandomInt(1, 6);
            let r2 = (a + c) * boundary - r1;
            lhsStr = `${formatExpr(a, 'x', 0)} + ${formatExpr(c, 'x', 0)}`;
            rhsStr = `${r1} + ${r2}`;
            stepDetails = {
              orig: `${lhsStr} ${inequalitySign} ${rhsStr}`,
              simplified: `${formatExpr(a + c, 'x', 0)} ${inequalitySign} ${r1 + r2}`,
              collected: null,
              isolated: `${formatExpr(a + c, 'x', 0)} ${inequalitySign} ${r1 + r2}`,
              coeff: a + c
            };
          } else if (formType === 4) {
            a = getRandomChoice([5, 6, 7]);
            c = getRandomChoice([1, 2, 3, 4]);
            if (a === c) c += 1;
            let r1 = getRandomInt(5, 12);
            let r2 = r1 - (a - c) * boundary;
            lhsStr = `${formatExpr(a, 'x', 0)} - ${formatExpr(c, 'x', 0)}`;
            rhsStr = `${r1} - ${r2}`;
            stepDetails = {
              orig: `${lhsStr} ${inequalitySign} ${rhsStr}`,
              simplified: `${formatExpr(a - c, 'x', 0)} ${inequalitySign} ${r1 - r2}`,
              collected: null,
              isolated: `${formatExpr(a - c, 'x', 0)} ${inequalitySign} ${r1 - r2}`,
              coeff: a - c
            };
          } else if (formType === 5) {
            a = getRandomChoice([-2, -1, 2, 3]);
            c = getRandomChoice([2, 4]);
            if (a + c === 0) c += 1;
            b = getRandomInt(1, 6);
            rhsVal = (a + c) * boundary + b;
            lhsStr = `${formatExpr(a, 'x', 0)} + ${b} + ${formatExpr(c, 'x', 0)}`;
            rhsStr = `${rhsVal}`;
            stepDetails = {
              orig: `${lhsStr} ${inequalitySign} ${rhsStr}`,
              simplified: `${formatExpr(a + c, 'x', 0)} + ${b} ${inequalitySign} ${rhsVal}`,
              collected: `${formatExpr(a + c, 'x', 0)} ${inequalitySign} ${rhsVal} - ${b}`,
              isolated: `${formatExpr(a + c, 'x', 0)} ${inequalitySign} ${rhsVal - b}`,
              coeff: a + c
            };
          } else {
            a = getRandomChoice([-3, -2, 1, 2]);
            c = getRandomChoice([-2, -1]);
            if (a + c === 0) a += 1;
            b = getRandomInt(1, 6);
            rhsVal = (a + c) * boundary - b;
            lhsStr = `${formatExpr(a, 'x', 0)} - ${b} ${c < 0 ? '-' : '+'} ${formatExpr(Math.abs(c), 'x', 0)}`;
            rhsStr = `${rhsVal}`;
            stepDetails = {
              orig: `${lhsStr} ${inequalitySign} ${rhsStr}`,
              simplified: `${formatExpr(a + c, 'x', 0)} - ${b} ${inequalitySign} ${rhsVal}`,
              collected: `${formatExpr(a + c, 'x', 0)} ${inequalitySign} ${rhsVal} + ${b}`,
              isolated: `${formatExpr(a + c, 'x', 0)} ${inequalitySign} ${rhsVal + b}`,
              coeff: a + c
            };
          }

          let netCoeff = stepDetails.coeff;
          let finalSign = inequalitySign;
          if (netCoeff < 0) {
            finalSign = reverseSign(inequalitySign);
          }

          let isClosed = (finalSign === '≥' || finalSign === '≤');
          let direction = (finalSign === '>' || finalSign === '≥') ? 'right' : 'left';

          let partBVal = boundary + getRandomChoice([-2, -1, 0, 1, 2]);
          let isPartBTrue = false;

          if (finalSign === '>') isPartBTrue = partBVal > boundary;
          else if (finalSign === '≥') isPartBTrue = partBVal >= boundary;
          else if (finalSign === '<') isPartBTrue = partBVal < boundary;
          else if (finalSign === '≤') isPartBTrue = partBVal <= boundary;

          let minVal = boundary - 4;
          let maxVal = boundary + 4;

          return {
            type: 'B',
            inequalityStr: `${lhsStr} ${inequalitySign} ${rhsStr}`,
            boundary,
            finalSign,
            isClosed,
            direction,
            minVal,
            maxVal,
            partBVal,
            partBAns: isPartBTrue ? 'Yes' : 'No',
            stepDetails,
            lhsStr,
            rhsStr,
            inequalitySign
          };
        }
      }

      function renderInteractiveNumberLine() {
        const container = document.getElementById('nlInteractiveContainer');
        if (!container || !currentProblem || currentProblem.type !== 'B') return;

        const state = {
          boundary: studentBoundary,
          closed: studentClosed,
          direction: studentDirection
        };

        container.innerHTML = renderNumberLineSVG(currentProblem.minVal, currentProblem.maxVal, state, true);

        const svgEl = document.getElementById('interactiveNumberLineSVG');
        if (svgEl) {
          svgEl.addEventListener('click', handleNumberLineClick);
        }
      }

      function handleNumberLineClick(e) {
        if (isSubmitted || !currentProblem || currentProblem.type !== 'B') return;

        const svgEl = document.getElementById('interactiveNumberLineSVG');
        if (!svgEl) return;

        const rect = svgEl.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const padding = 40;
        const viewBoxWidth = 500;
        const count = currentProblem.maxVal - currentProblem.minVal;
        const step = (viewBoxWidth - 2 * padding) / count;

        const svgX = (clickX / rect.width) * viewBoxWidth;
        const clickedVal = Math.round(currentProblem.minVal + (svgX - padding) / step);

        if (studentBoundary === null) {
          if (clickedVal >= currentProblem.minVal && clickedVal <= currentProblem.maxVal) {
            studentBoundary = clickedVal;
            studentClosed = false;
            studentDirection = null;
          }
        } else {
          if (clickedVal === studentBoundary) {
            studentClosed = !studentClosed;
          } else {
            if (clickedVal < studentBoundary) {
              studentDirection = 'left';
            } else if (clickedVal > studentBoundary) {
              studentDirection = 'right';
            }
          }
        }

        renderInteractiveNumberLine();
      }

      generateBtn.addEventListener('click', () => {
        isSubmitted = false;
        feedbackBox.style.display = 'none';
        feedbackBox.className = 'feedback';
        studentAnswerSummary.style.display = 'none';

        studentBoundary = null;
        studentClosed = false;
        studentDirection = null;
        studentPartBChoice = null;

        undoDrawBtn.disabled = false;
        clearDrawBtn.disabled = false;
        canvas.classList.remove('disabled');

        clearCanvas();

        currentProblem = generateQuestionData();

        if (currentProblem.type === 'A') {
          questionPrompt.textContent = "Fill the boxes with '≥', '≤', '>' or '<'.";
          equationDisplay.innerHTML = `<div>Choose the correct inequality sign for each part below.</div>`;

          inputSection.innerHTML = `
            <div class="part-block">
              <div class="part-title">(a) Relationship between a and b</div>
              <div style="font-size: 1.05rem; margin-bottom: 12px; font-weight: 500;">
                If <b>a ${currentProblem.part1.givenSign} b</b>, then:
              </div>
              <div class="input-row">
                <span class="input-label">${currentProblem.part1.expr1}</span>
                <select id="ansPart1">
                  <option value="">Select</option>
                  <option value="≥">≥</option>
                  <option value="≤">≤</option>
                  <option value=">">&gt;</option>
                  <option value="<">&lt;</option>
                </select>
                <span class="input-label">${currentProblem.part1.expr2}</span>
              </div>
            </div>

            <div class="part-block">
              <div class="part-title">(b) Relationship between x and y</div>
              <div style="font-size: 1.05rem; margin-bottom: 12px; font-weight: 500;">
                If <b>x ${currentProblem.part2.givenSign} y</b>, then:
              </div>
              <div class="input-row">
                <span class="input-label">${currentProblem.part2.expr1}</span>
                <select id="ansPart2">
                  <option value="">Select</option>
                  <option value="≥">≥</option>
                  <option value="≤">≤</option>
                  <option value=">">&gt;</option>
                  <option value="<">&lt;</option>
                </select>
                <span class="input-label">${currentProblem.part2.expr2}</span>
              </div>
            </div>

            <div class="part-block">
              <div class="part-title">(c) Relationship between p and q</div>
              <div style="font-size: 1.05rem; margin-bottom: 12px; font-weight: 500;">
                If <b>p ${currentProblem.part3.givenSign} q</b>, then:
              </div>
              <div class="input-row">
                <span class="input-label">${currentProblem.part3.expr1}</span>
                <select id="ansPart3">
                  <option value="">Select</option>
                  <option value="≥">≥</option>
                  <option value="≤">≤</option>
                  <option value=">">&gt;</option>
                  <option value="<">&lt;</option>
                </select>
                <span class="input-label">${currentProblem.part3.expr2}</span>
              </div>
            </div>

            <div class="part-block">
              <div class="part-title">(d) Relationship between m and n</div>
              <div style="font-size: 1.05rem; margin-bottom: 12px; font-weight: 500;">
                If <b>m ${currentProblem.part4.givenSign} n</b>, then:
              </div>
              <div class="input-row">
                <span class="input-label">${currentProblem.part4.expr1}</span>
                <select id="ansPart4">
                  <option value="">Select</option>
                  <option value="≥">≥</option>
                  <option value="≤">≤</option>
                  <option value=">">&gt;</option>
                  <option value="<">&lt;</option>
                </select>
                <span class="input-label">${currentProblem.part4.expr2}</span>
              </div>
            </div>


            <button id="submitBtn">Submit Answer</button>
          `;
        } else {
          questionPrompt.textContent = "Solve the linear inequality, represent it on the number line, and answer the sub-question.";
          equationDisplay.innerHTML = `<div>Solve the inequality: <b>${currentProblem.inequalityStr}</b></div>`;

          inputSection.innerHTML = `
            <div class="part-block">
              <div class="part-title">(a) Solve and draw on number line</div>
              <div class="input-row" style="margin-bottom: 12px;">
                <span class="input-label">x</span>
                <select id="ansSign">
                  <option value="">Sign</option>
                  <option value="≥">≥</option>
                  <option value="≤">≤</option>
                  <option value=">">&gt;</option>
                  <option value="<">&lt;</option>
                </select>
                <input type="text" id="ansVal" placeholder="value" style="width: 80px;" />
              </div>
              <div style="font-size: 0.85rem; color: #64748b; margin-bottom: 8px;">
                <b>Interactive Number Line instructions:</b><br/>
                1. Click a tick number to set start point.<br/>
                2. Click left/right of point to draw ray.<br/>
                3. Click the circle to toggle open/closed dot.
              </div>
              <div id="nlInteractiveContainer"></div>
              <button type="button" class="draw-btn" id="resetNlBtn" style="margin-top: 8px; width: auto;">Reset Line</button>
            </div>

            <div class="part-block">
              <div class="part-title">(b) Verification</div>
              <div style="margin-bottom: 10px; font-size: 0.95rem;">
                Is <b>${currentProblem.partBVal}</b> a possible solution for <i>x</i>?
              </div>
              <div class="btn-group">
                <button type="button" class="choice-btn" id="btnYes">Yes</button>
                <button type="button" class="choice-btn" id="btnNo">No</button>
              </div>
            </div>

            <button id="submitBtn">Submit Answer</button>
          `;

          const resetNlBtn = document.getElementById('resetNlBtn');
          resetNlBtn.addEventListener('click', () => {
            if (isSubmitted) return;
            studentBoundary = null;
            studentClosed = false;
            studentDirection = null;
            renderInteractiveNumberLine();
          });

          const btnYes = document.getElementById('btnYes');
          const btnNo = document.getElementById('btnNo');

          btnYes.addEventListener('click', () => {
            if (isSubmitted) return;
            studentPartBChoice = 'Yes';
            btnYes.classList.add('selected');
            btnNo.classList.remove('selected');
          });

          btnNo.addEventListener('click', () => {
            if (isSubmitted) return;
            studentPartBChoice = 'No';
            btnNo.classList.add('selected');
            btnYes.classList.remove('selected');
          });

          renderInteractiveNumberLine();
        }

        inputSection.style.display = 'flex';
        drawSection.style.display = 'flex';
        savePdfBtn.style.display = 'none';

        setTimeout(resizeCanvas, 50);

        document.getElementById('submitBtn').addEventListener('click', handleSubmit);
      });

      function handleSubmit() {
        if (isSubmitted) return;

        if (currentProblem.type === 'A') {
          const ans1 = document.getElementById('ansPart1').value;
          const ans2 = document.getElementById('ansPart2').value;
          const ans3 = document.getElementById('ansPart3').value;
          const ans4 = document.getElementById('ansPart4').value;

          if (!ans1 || !ans2 || !ans3 || !ans4) {
            alert('Please select an inequality sign for all parts.');
            return;
          }

          isSubmitted = true;
          disableInputs();

          const isPart1Correct = (ans1 === currentProblem.part1.correctSign);
          const isPart2Correct = (ans2 === currentProblem.part2.correctSign);
          const isPart3Correct = (ans3 === currentProblem.part3.correctSign);
          const isPart4Correct = (ans4 === currentProblem.part4.correctSign);
          const isAllCorrect = isPart1Correct && isPart2Correct && isPart3Correct && isPart4Correct;

          const userName = document.getElementById('userNameInput').value.trim();
          let summaryHtml = `<strong>Name:</strong> ${userName || 'N/A'}<br/>`;
          summaryHtml += `<strong>(a) Your answer:</strong> ${currentProblem.part1.expr1} ${ans1} ${currentProblem.part1.expr2}<br/>`;
          summaryHtml += `<strong>(b) Your answer:</strong> ${currentProblem.part2.expr1} ${ans2} ${currentProblem.part2.expr2}`;
          summaryHtml += `<strong>(a) Your answer:</strong> ${currentProblem.part3.expr1} ${ans3} ${currentProblem.part3.expr2}<br/>`;
          summaryHtml += `<strong>(b) Your answer:</strong> ${currentProblem.part4.expr1} ${ans4} ${currentProblem.part4.expr2}`;
          studentAnswerSummary.innerHTML = summaryHtml;
          studentAnswerSummary.style.display = 'none';

          if (isAllCorrect) {
            feedbackBox.className = 'feedback correct';
            feedbackBox.innerHTML = 'Correct! Excellent work!';
            if (window.recordCorrectSubmission) {
              window.recordCorrectSubmission();
            }
          } else {
            feedbackBox.className = 'feedback incorrect';
            let fbHtml = `<div class="feedback-heading">Incorrect</div>`;

            fbHtml += `<div class="solution-line-block"><div class="solution-line-title">Step-by-Step Solution:</div>`;

              const renderFeedbackPart = (label, var1, var2, part) => {
                let html = `<div style="margin-top: 10px; font-weight: bold;">Part (${label}):</div><div class="math-working">`;
                html += `Given: ${var1} ${part.givenSign} ${var2}<br/>`;
                if (part.coeff < 0) {
                  html += `Multiplying or dividing by a negative number (${part.coeff}) REVERSES the inequality sign.<br/>`;
                  html += `Sign changes from '${part.givenSign}' to '${part.correctSign}'.<br/>`;
                } else {
                  html += `Multiplying or dividing by a positive number (${part.coeff}) KEEPS the inequality sign unchanged.<br/>`;
                }
                html += `Correct Result: <b>${part.expr1} ${part.correctSign} ${part.expr2}</b></div>`;
                return html;
              };

              fbHtml += renderFeedbackPart('a', 'a', 'b', currentProblem.part1);
              fbHtml += renderFeedbackPart('b', 'x', 'y', currentProblem.part2);
              fbHtml += renderFeedbackPart('c', 'p', 'q', currentProblem.part3);
              fbHtml += renderFeedbackPart('d', 'm', 'n', currentProblem.part4);

              fbHtml += `</div>`;
              feedbackBox.innerHTML = fbHtml;
          }

        } else {
          const ansSign = document.getElementById('ansSign').value;
          const ansValStr = document.getElementById('ansVal').value.trim();
          const ansVal = parseInt(ansValStr, 10);

          if (!ansSign || isNaN(ansVal)) {
            alert('Please select a sign and enter a valid integer for part (a).');
            return;
          }

          if (studentBoundary === null || studentDirection === null) {
            alert('Please draw the ray on the number line for part (a). Click a number tick, then click to the left or right.');
            return;
          }

          if (!studentPartBChoice) {
            alert('Please answer Part (b) by selecting Yes or No.');
            return;
          }

          isSubmitted = true;
          disableInputs();

          const isPartAAlgebraCorrect = (ansSign === currentProblem.finalSign) && (ansVal === currentProblem.boundary);
          const isPartAGraphCorrect = (studentBoundary === currentProblem.boundary) &&
                                      (studentClosed === currentProblem.isClosed) &&
                                      (studentDirection === currentProblem.direction);
          const isPartBCorrect = (studentPartBChoice === currentProblem.partBAns);

          const isAllCorrect = isPartAAlgebraCorrect && isPartAGraphCorrect && isPartBCorrect;

          const userName = document.getElementById('userNameInput').value.trim();
          let summaryHtml = `<strong>Name:</strong> ${userName || 'N/A'}<br/>`;
          summaryHtml += `<strong>(a) Algebraic Solution:</strong> x ${ansSign} ${ansVal}<br/>`;
          summaryHtml += `<strong>(a) Number Line:</strong> Point at ${studentBoundary} (${studentClosed ? 'Closed' : 'Open'} circle), Ray pointing ${studentDirection}<br/>`;
          summaryHtml += `<strong>(b) Verification Answer:</strong> Is ${currentProblem.partBVal} a solution? ${studentPartBChoice}`;
          studentAnswerSummary.innerHTML = summaryHtml;
          studentAnswerSummary.style.display = 'none';

          if (isAllCorrect) {
            feedbackBox.className = 'feedback correct';
            feedbackBox.innerHTML = 'Correct! Excellent work!';
            if (window.recordCorrectSubmission) {
              window.recordCorrectSubmission();
            }
          } else {
            feedbackBox.className = 'feedback incorrect';
            let fbHtml = `<div class="feedback-heading">Incorrect</div>`;

            fbHtml += `<div class="solution-line-block">`;
            fbHtml += `<div class="solution-line-title">Step-by-Step Solution:</div>`;

            fbHtml += `<div style="margin-top: 10px; font-weight: bold;">Part (a) Algebraic Solution:</div>`;
            fbHtml += `<div class="math-working">`;
            fbHtml += `${currentProblem.stepDetails.orig}<br/>`;
            if (currentProblem.stepDetails.simplified) {
              fbHtml += `${currentProblem.stepDetails.simplified}<br/>`;
            }
            if (currentProblem.stepDetails.collected) {
              fbHtml += `${currentProblem.stepDetails.collected}<br/>`;
            }
            if (currentProblem.stepDetails.isolated) {
              fbHtml += `${currentProblem.stepDetails.isolated}<br/>`;
            }

            if (currentProblem.stepDetails.coeff < 0) {
              fbHtml += `Dividing by negative coefficient (${currentProblem.stepDetails.coeff}) -> <b>REVERSE sign</b><br/>`;
            }
            fbHtml += `<b>x ${currentProblem.finalSign} ${currentProblem.boundary}</b>`;
            fbHtml += `</div>`;

            fbHtml += `<div style="margin-top: 15px; font-weight: bold;">Part (a) Number Line Representation:</div>`;
            fbHtml += `<div style="margin-bottom: 8px;">`;
            fbHtml += `Boundary circle at <b>${currentProblem.boundary}</b> (${currentProblem.isClosed ? 'Closed / Solid circle because of ' + currentProblem.finalSign : 'Open circle because of ' + currentProblem.finalSign}).<br/>`;
            fbHtml += `Ray points to the <b>${currentProblem.direction}</b>.`;
            fbHtml += `</div>`;

            const correctState = {
              boundary: currentProblem.boundary,
              closed: currentProblem.isClosed,
              direction: currentProblem.direction
            };
            fbHtml += `<div class="graph-container">${renderNumberLineSVG(currentProblem.minVal, currentProblem.maxVal, correctState, false)}</div>`;

            fbHtml += `<div style="margin-top: 15px; font-weight: bold;">Part (b) Verification:</div>`;
            fbHtml += `<div class="math-working">`;
            fbHtml += `Substitute x = ${currentProblem.partBVal} into x ${currentProblem.finalSign} ${currentProblem.boundary}:<br/>`;
            fbHtml += `${currentProblem.partBVal} ${currentProblem.finalSign} ${currentProblem.boundary} is <b>${currentProblem.partBAns === 'Yes' ? 'TRUE' : 'FALSE'}</b>.<br/>`;
            fbHtml += `Correct answer: <b>${currentProblem.partBAns}</b>`;
            fbHtml += `</div>`;

            fbHtml += `</div>`;
            feedbackBox.innerHTML = fbHtml;
          }
        }

        feedbackBox.style.display = 'block';
        savePdfBtn.style.display = 'block';
        syncPrintImage();
      }

      function disableInputs() {
        const submitBtn = document.getElementById('submitBtn');
        if (submitBtn) submitBtn.disabled = true;

        const selects = inputSection.querySelectorAll('select');
        selects.forEach(s => s.disabled = true);

        const inputs = inputSection.querySelectorAll('input');
        inputs.forEach(i => i.disabled = true);

        const buttons = inputSection.querySelectorAll('button');
        buttons.forEach(b => {
          if (b.id !== 'submitBtn') b.disabled = true;
        });

        undoDrawBtn.disabled = true;
        clearDrawBtn.disabled = true;
        canvas.classList.add('disabled');
      }

      savePdfBtn.addEventListener('click', () => {
        syncPrintImage();
        window.print();
      });
    });
  </script>
