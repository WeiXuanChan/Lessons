<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Linear Inequalities</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --secondary: #0284c7;
      --secondary-hover: #0369a1;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --success: #16a34a;
      --error: #dc2626;
      --disabled: #94a3b8;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 1100px;
      padding: 30px;
      position: relative;
    }

    .user-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .user-header label {
      font-weight: bold;
      font-size: 0.95rem;
    }

    .user-header input {
      max-width: 250px;
      padding: 6px 12px;
    }

    h1 {
      text-align: center;
      color: var(--primary);
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .difficulty-section {
      margin-bottom: 25px;
      background: #f1f5f9;
      padding: 15px;
      border-radius: 8px;
    }

    .difficulty-labels {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .difficulty-labels span {
      flex: 1;
      text-align: center;
      color: var(--disabled);
      cursor: pointer;
    }

    .difficulty-labels span.active {
      color: var(--primary);
    }

    .slider {
      width: 100%;
      appearance: none;
      height: 8px;
      border-radius: 5px;
      background: #cbd5e1;
      outline: none;
    }

    .slider::-webkit-slider-thumb {
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
    }

    .workspace-layout {
      display: flex;
      gap: 25px;
      align-items: stretch;
      margin-bottom: 20px;
    }

    .left-column {
      flex: 1.2;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .right-column {
      flex: 0.8;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 850px) {
      .workspace-layout {
        flex-direction: column;
      }
    }

    button {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-bottom: 20px;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:disabled {
      background-color: var(--disabled) !important;
      cursor: not-allowed !important;
    }

    .btn-secondary {
      background-color: var(--secondary);
      margin-top: 15px;
      margin-bottom: 0;
    }

    .btn-secondary:hover {
      background-color: var(--secondary-hover);
    }

    .question-box {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .question-prompt {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 10px;
    }

    .equation-display {
      font-size: 1rem;
      line-height: 1.6;
    }

    .graph-container {
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
      aspect-ratio: 4 / 1;
    }

    svg {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      border-radius: 8px;
      overflow: visible;
    }

    .draw-section {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .draw-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .draw-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--text);
    }

    .draw-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .draw-btn {
      width: auto;
      padding: 4px 10px;
      margin-bottom: 0;
      font-size: 0.8rem;
      background-color: #e2e8f0;
      color: var(--text);
    }

    .draw-btn:hover {
      background-color: #cbd5e1;
    }

    .canvas-container {
      width: 100%;
      flex: 1;
      min-height: 320px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: #ffffff;
      touch-action: none;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 8px;
      cursor: crosshair;
    }

    canvas.disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .print-draw-image {
      display: none;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .input-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
    }

    .part-block {
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 12px 15px;
      border-radius: 8px;
    }

    .part-title {
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 0.95rem;
      color: var(--primary);
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .input-row:last-child {
      margin-bottom: 0;
    }

    .input-label {
      font-size: 0.95rem;
      font-weight: bold;
      white-space: nowrap;
    }

    select, input[type="text"], input[type="number"] {
      padding: 8px 12px;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
    }

    select {
      background-color: white;
      cursor: pointer;
    }

    input[type="text"]:focus, input[type="number"]:focus, select:focus {
      border-color: var(--primary);
    }

    input[type="text"]:disabled, input[type="number"]:disabled, select:disabled {
      background-color: #f1f5f9;
      color: #64748b;
      cursor: not-allowed;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .choice-btn {
      flex: 1;
      padding: 8px;
      margin-bottom: 0;
      background-color: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
    }

    .choice-btn:hover {
      background-color: #f1f5f9;
    }

    .choice-btn.selected {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .feedback {
      border-radius: 8px;
      padding: 15px;
      display: none;
      margin-top: 15px;
    }

    .feedback.correct {
      display: block !important;
      background-color: #dcfce7;
      border: 1px solid #bbf7d0;
      color: #15803d;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .feedback.incorrect {
      display: block !important;
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .feedback-heading {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 10px;
      color: var(--error);
    }

    .solution-line-block {
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
      color: var(--text);
    }

    .solution-line-title {
      font-weight: bold;
      font-size: 1.05rem;
      margin-bottom: 10px;
      color: var(--text);
    }

    .math-working {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      line-height: 1.7;
      background: #f8fafc;
      padding: 10px;
      border-radius: 6px;
      border-left: 3px solid var(--primary);
      margin-top: 10px;
      white-space: pre-wrap;
      color: var(--text);
    }

    .student-answer-summary {
      display: none;
      font-size: 1rem;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .number-line-interactive {
      cursor: pointer;
      user-select: none;
      touch-action: none;
    }

    .draggable-circle {
      cursor: grab;
    }

    .draggable-circle:active {
      cursor: grabbing;
    }

    @media print {
      body {
        background-color: #ffffff;
        padding: 0;
      }

      .container {
        box-shadow: none;
        border: none;
        max-width: 100%;
        padding: 0;
      }

      .workspace-layout {
        display: block;
      }

      .user-header,
      .difficulty-section,
      #generateBtn,
      #submitBtn,
      #savePdfBtn,
      .input-section,
      .draw-controls {
        display: none !important;
      }

      .student-answer-summary {
        display: block !important;
      }

      .question-box {
        border: 1px solid #cbd5e1;
      }

      .canvas-container {
        display: none !important;
      }

      .print-draw-image {
        display: block !important;
        margin-top: 15px;
        margin-bottom: 15px;
      }

      .feedback {
        display: block !important;
        border: 1px solid #cbd5e1;
        background-color: #f8fafc !important;
        color: #0f172a !important;
      }

      .feedback-heading {
        color: var(--error);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="user-header">
      <label for="userNameInput">Name:</label>
      <input type="text" id="userNameInput" placeholder="Enter your initials" />
    </div>

    <h1>Simple Linear Inequalities</h1>

    <div class="difficulty-section">
      <div class="difficulty-labels">
        <span id="labelBasic" class="active">Basic</span>
        <span id="labelInter" class="disabled" style="display:none;">Intermediate</span>
        <span id="labelAdvance" class="disabled">Advance</span>
      </div>
      <input type="range" min="1" max="1" value="1" class="slider" id="difficultySlider" disabled>
    </div>

    <button id="generateBtn">Generate Question</button>

    <div class="workspace-layout">
      <div class="left-column">
        <div class="question-box">
          <div class="question-prompt" id="questionPrompt">Click "Generate Question" to begin.</div>
          <div class="equation-display" id="equationDisplay"></div>
        </div>

        <div class="input-section" id="inputSection" style="display: none;">
          <!-- Dynamically populated -->
        </div>
      </div>

      <div class="right-column">
        <div class="draw-section" id="drawSection" style="display: none;">
          <div class="draw-header">
            <span class="draw-title">Working Space (Draw / Scratchpad):</span>
            <div class="draw-controls">
              <button type="button" class="draw-btn" id="undoDrawBtn">Undo</button>
              <button type="button" class="draw-btn" id="clearDrawBtn">Clear</button>
            </div>
          </div>
          <div class="canvas-container">
            <canvas id="workingCanvas"></canvas>
          </div>
          <img id="printDrawImage" class="print-draw-image" alt="Student Working Drawing" />
        </div>
      </div>
    </div>

    <div class="student-answer-summary" id="studentAnswerSummary"></div>
    <div class="feedback" id="feedbackBox"></div>
    <button id="savePdfBtn" class="btn-secondary" style="display: none;">Save PDF</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
    import { getFirestore, collection, addDoc, doc, setDoc, increment, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
    // Get the query string part of the URL (everything after and including "?")
    const queryString = window.location.search;
    
    const firebaseConfig = {
      apiKey: "AIzaSyAd0olTVny--vwE9UVzh5YRDE7lzha6y08",
      authDomain: "qg-summary.firebaseapp.com",
      projectId: "qg-summary",
      storageBucket: "qg-summary.firebasestorage.app",
      messagingSenderId: "660515596494",
      appId: "1:660515596494:web:11d5aacc8c3937f452089f",
      measurementId: "G-5T9WWML4EK"
    };

    let db;
    try {
      const app = initializeApp(firebaseConfig);
      getAnalytics(app);
      db = getFirestore(app);
    } catch(e) {
      console.warn("Firebase initialization warning:", e);
    }

    window.recordCorrectSubmission = async function() {
      if (!db) return;
      const userNameInput = document.getElementById('userNameInput');
      const name = userNameInput.value.trim() || 'Anonymous';

      try {
        const expireDate = new Date();
        expireDate.setMonth(expireDate.getMonth() + 3);

          timestamp: serverTimestamp(),

          expireAt: Timestamp.fromDate(expireDate) //TTL
        });

        const counterRef = doc(db, "counter"+queryString, name);
        await setDoc(counterRef, {
          name: name,
          Chap1_4: increment(1),
          countTotal: increment(1)
        }, { merge: true });

      } catch (err) {
        console.error("Firebase write error:", err);
      }
    };
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let currentProblem = null;
      let isSubmitted = false;

      let studentBoundary = null;
      let studentClosed = false;
      let studentDirection = null;
      let studentCheckChoice = null;
      let isDraggingBoundary = false;

      const generateBtn = document.getElementById('generateBtn');
      const questionPrompt = document.getElementById('questionPrompt');
      const equationDisplay = document.getElementById('equationDisplay');
      const inputSection = document.getElementById('inputSection');
      const feedbackBox = document.getElementById('feedbackBox');
      const savePdfBtn = document.getElementById('savePdfBtn');
      const studentAnswerSummary = document.getElementById('studentAnswerSummary');

      const drawSection = document.getElementById('drawSection');
      const canvas = document.getElementById('workingCanvas');
      const ctx = canvas.getContext('2d');
      const clearDrawBtn = document.getElementById('clearDrawBtn');
      const undoDrawBtn = document.getElementById('undoDrawBtn');
      const printDrawImage = document.getElementById('printDrawImage');

      let isDrawing = false;
      let strokeHistory = [];
      let currentStroke = [];

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          canvas.width = rect.width;
          canvas.height = rect.height;
          redrawCanvas();
        }
      }

      function getCanvasCoordinates(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      }

      function startDrawing(e) {
        if (isSubmitted) return;
        isDrawing = true;
        const pos = getCanvasCoordinates(e);
        currentStroke = [{ x: pos.x, y: pos.y }];
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      }

      function draw(e) {
        if (!isDrawing || isSubmitted) return;
        e.preventDefault();
        const pos = getCanvasCoordinates(e);
        currentStroke.push({ x: pos.x, y: pos.y });

        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#0f172a';

        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      }

      function stopDrawing() {
        if (!isDrawing) return;
        isDrawing = false;
        if (currentStroke.length > 0) {
          strokeHistory.push([...currentStroke]);
          currentStroke = [];
        }
      }

      function redrawCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#0f172a';

        strokeHistory.forEach(stroke => {
          if (stroke.length < 2) return;
          ctx.beginPath();
          ctx.moveTo(stroke[0].x, stroke[0].y);
          for (let i = 1; i < stroke.length; i++) {
            ctx.lineTo(stroke[i].x, stroke[i].y);
          }
          ctx.stroke();
        });
      }

      function clearCanvas() {
        if (isSubmitted) return;
        strokeHistory = [];
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      function undoCanvas() {
        if (isSubmitted) return;
        strokeHistory.pop();
        redrawCanvas();
      }

      function syncPrintImage() {
        printDrawImage.src = canvas.toDataURL('image/png');
      }

      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseleave', stopDrawing);

      canvas.addEventListener('touchstart', startDrawing, { passive: false });
      canvas.addEventListener('touchmove', draw, { passive: false });
      canvas.addEventListener('touchend', stopDrawing);

      clearDrawBtn.addEventListener('click', clearCanvas);
      undoDrawBtn.addEventListener('click', undoCanvas);
      window.addEventListener('resize', resizeCanvas);

      function gcd(a, b) {
        a = Math.abs(a);
        b = Math.abs(b);
        while (b) {
          let t = b;
          b = a % b;
          a = t;
        }
        return a;
      }

      function createFraction(n, d) {
        if (d < 0) { n = -n; d = -d; }
        const g = gcd(n, d);
        return { n: n / g, d: d / g };
      }

      function formatImproperFraction(frac) {
        const { n, d } = frac;
        if (d === 1) return `${n}`;
        return `${n}/${d}`;
      }

      function formatMixedFraction(frac) {
        const { n, d } = frac;
        if (d === 1) return `${n}`;
        const isNeg = n < 0;
        const absN = Math.abs(n);
        const integer = Math.floor(absN / d);
        const rem = absN % d;
        const signStr = isNeg ? "-" : "";

        if (integer === 0) {
          return `${signStr}${rem}/${d}`;
        }
        return `${signStr}${integer} ${rem}/${d}`;
      }

      function parseMixedFraction(str) {
        if (!str) return null;
        str = str.trim();
        let isNeg = false;
        if (str.startsWith('-')) {
          isNeg = true;
          str = str.substring(1).trim();
        }

        if (str.includes(' ')) {
          const parts = str.split(/\s+/);
          if (parts.length !== 2) return null;
          const integer = parseInt(parts[0], 10);
          const fracParts = parts[1].split('/');
          if (fracParts.length !== 2) return null;
          const num = parseInt(fracParts[0], 10);
          const den = parseInt(fracParts[1], 10);
          if (isNaN(integer) || isNaN(num) || isNaN(den) || den === 0) return null;
          const totalNum = integer * den + num;
          return createFraction(isNeg ? -totalNum : totalNum, den);
        } else if (str.includes('/')) {
          const fracParts = str.split('/');
          if (fracParts.length !== 2) return null;
          const num = parseInt(fracParts[0], 10);
          const den = parseInt(fracParts[1], 10);
          if (isNaN(num) || isNaN(den) || den === 0) return null;
          return createFraction(isNeg ? -num : num, den);
        } else {
          const val = parseInt(str, 10);
          if (isNaN(val)) return null;
          return createFraction(isNeg ? -val : val, 1);
        }
      }

      function snapToFractionDen235(rawVal) {
        const step = 1 / 30;
        const stepsCount = Math.round(rawVal / step);
        const quantized = stepsCount * step;

        const total30th = Math.round(quantized * 30);
        let bestFrac = null;
        let minDiff = Infinity;

        const intPart = Math.floor(total30th / 30);
        const rem30 = ((total30th % 30) + 30) % 30;

        const validDens = [1, 2, 3, 5];
        for (let d of validDens) {
          let num = Math.round((rem30 / 30) * d);
          let valCandidate = intPart + num / d;
          let diff = Math.abs(valCandidate - rawVal);
          if (diff < minDiff) {
            minDiff = diff;
            let fullNum = intPart * d + num;
            bestFrac = createFraction(fullNum, d);
          }
        }
        return bestFrac;
      }

      function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function getRandomChoice(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function reverseSign(sign) {
        const map = { '≥': '≤', '≤': '≥', '>': '<', '<': '>' };
        return map[sign] || sign;
      }

      function formatExpr(coeff, varName, constVal) {
        let res = "";
        if (coeff === 1) res += varName;
        else if (coeff === -1) res += `-${varName}`;
        else res += `${coeff}${varName}`;

        if (constVal > 0) res += ` + ${constVal}`;
        else if (constVal < 0) res += ` - ${Math.abs(constVal)}`;

        return res;
      }

      function renderNumberLineSVG(minVal, maxVal, state = null, isInteractive = false) {
        const viewBoxWidth = 500;
        const viewBoxHeight = 100;
        const padding = 40;
        const count = maxVal - minVal;
        const step = (viewBoxWidth - 2 * padding) / count;
        const yAxis = 65;

        let svgHtml = `<svg viewBox="0 0 ${viewBoxWidth} ${viewBoxHeight}" ${isInteractive ? 'class="number-line-interactive" id="interactiveNumberLineSVG"' : ''}>`;

        svgHtml += `
          <defs>
            <marker id="nlArrowRight" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
            </marker>
            <marker id="nlArrowLeft" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
            </marker>
            <marker id="axisArrowRight" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
            </marker>
            <marker id="axisArrowLeft" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
            </marker>
          </defs>
        `;

        svgHtml += `<line x1="${padding - 15}" y1="${yAxis}" x2="${viewBoxWidth - padding + 15}" y2="${yAxis}" stroke="#334155" stroke-width="2" marker-start="url(#axisArrowLeft)" marker-end="url(#axisArrowRight)" />`;

        for (let i = 0; i <= count; i++) {
          let val = minVal + i;
          let x = padding + i * step;

          svgHtml += `<line x1="${x}" y1="${yAxis - 6}" x2="${x}" y2="${yAxis + 6}" stroke="#334155" stroke-width="2" />`;
          svgHtml += `<text x="${x}" y="${yAxis + 22}" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">${val}</text>`;
        }

        if (state && state.boundary !== null && state.boundary >= minVal && state.boundary <= maxVal) {
          const cx = padding + (state.boundary - minVal) * step;
          const cy = yAxis - 25;

          if (state.direction === 'left') {
            svgHtml += `<line x1="${cx}" y1="${cy}" x2="${padding - 10}" y2="${cy}" stroke="#dc2626" stroke-width="3" marker-end="url(#nlArrowLeft)" />`;
          } else if (state.direction === 'right') {
            svgHtml += `<line x1="${cx}" y1="${cy}" x2="${viewBoxWidth - padding + 10}" y2="${cy}" stroke="#dc2626" stroke-width="3" marker-end="url(#nlArrowRight)" />`;
          }

          svgHtml += `<line x1="${cx}" y1="${cy}" x2="${cx}" y2="${yAxis}" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,3" />`;

          const circleClass = isInteractive ? 'draggable-circle' : '';
          if (state.closed) {
            svgHtml += `<circle id="boundaryCircle" class="${circleClass}" cx="${cx}" cy="${cy}" r="7" fill="#dc2626" stroke="#dc2626" stroke-width="2.5" />`;
          } else {
            svgHtml += `<circle id="boundaryCircle" class="${circleClass}" cx="${cx}" cy="${cy}" r="7" fill="#ffffff" stroke="#dc2626" stroke-width="2.5" />`;
          }

          let currentFrac = state.boundaryFrac || snapToFractionDen235(state.boundary);
          if (currentFrac && currentFrac.d !== 1) {
            let labelStr = formatMixedFraction(currentFrac);
            svgHtml += `<text x="${cx}" y="${cy - 12}" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">${labelStr}</text>`;
          }
        }

        svgHtml += `</svg>`;
        return svgHtml;
      }

      function generateQuestionData() {
        const type = Math.random() < 0.5 ? 'A' : 'B';
        const signs = ['≥', '≤', '>', '<'];

        if (type === 'A') {
          const createPart = (var1, var2) => {
            const sign = getRandomChoice(signs);
            const coeff = getRandomChoice([-4, -3, -2, 2, 3, 4, 5]);
            const constVal = getRandomInt(-5, 5);
            const correctSign = coeff < 0 ? reverseSign(sign) : sign;
            return {
              givenSign: sign,
              coeff: coeff,
              constVal: constVal,
              expr1: formatExpr(coeff, var1, constVal),
              expr2: formatExpr(coeff, var2, constVal),
              correctSign: correctSign
            };
          };

          return {
            type: 'A',
            part1: createPart('a','b'),
            part2: createPart('x', 'y'),
            part3: createPart('p', 'q'),
            part4: createPart('m', 'n')
          };
        } else {
          const inequalitySign = getRandomChoice(signs);
          
          const denOptions = [2, 3, 5];
          const bDen = getRandomChoice(denOptions);
          let bNum = getRandomInt(-4 * bDen + 1, 5 * bDen - 1);
          if (bNum % bDen === 0) bNum += 1;
          
          const boundaryFrac = createFraction(bNum, bDen);
          const boundaryVal = boundaryFrac.n / boundaryFrac.d;

          const formType = getRandomInt(1, 6);
          let lhsStr = "", rhsStr = "";
          let stepDetails = {};

          let a, b, c, rhsValFrac;

          if (formType === 1) {
            a = getRandomChoice([-4, -3, -2, 2, 3, 4, 5]);
            b = getRandomInt(1, 8);
            rhsValFrac = createFraction(a * boundaryFrac.n + b * boundaryFrac.d, boundaryFrac.d);
            lhsStr = `${formatExpr(a, 'x', 0)} + ${b}`;
            rhsStr = formatMixedFraction(rhsValFrac);
            stepDetails = {
              orig: `${lhsStr} ${inequalitySign} ${rhsStr}`,
              simplified: null,
              collected: `${formatExpr(a, 'x', 0)} ${inequalitySign} ${formatImproperFraction(rhsValFrac)} - ${b}`,
              isolated: `${formatExpr(a, 'x', 0)} ${inequalitySign} ${formatImproperFraction(createFraction(a * boundaryFrac.n, boundaryFrac.d))}`,
              coeff: a
            };
          } else if (formType === 2) {
            a = getRandomChoice([-4, -3, -2, 2, 3, 4, 5]);
            b = getRandomInt(1, 8);
            rhsValFrac = createFraction(a * boundaryFrac.n - b * boundaryFrac.d, boundaryFrac.d);
            lhsStr = `${formatExpr(a, 'x', 0)} - ${b}`;
            rhsStr = formatMixedFraction(rhsValFrac);
            stepDetails = {
              orig: `${lhsStr} ${inequalitySign} ${rhsStr}`,
              simplified: null,
              collected: `${formatExpr(a, 'x', 0)} ${inequalitySign} ${formatImproperFraction(rhsValFrac)} + ${b}`,
              isolated: `${formatExpr(a, 'x', 0)} ${inequalitySign} ${formatImproperFraction(createFraction(a * boundaryFrac.n, boundaryFrac.d))}`,
              coeff: a
            };
          } else if (formType === 3) {
            a = getRandomChoice([2, 3, 4]);
            c = getRandomChoice([1, 2, 3]);
            let r1 = getRandomInt(1, 6);
            let totalCoeff = a + c;
            let r2Frac = createFraction(totalCoeff * boundaryFrac.n - r1 * boundaryFrac.d, boundaryFrac.d);
            lhsStr = `${formatExpr(a, 'x', 0)} + ${formatExpr(c, 'x', 0)}`;
            rhsStr = `${r1} + (${formatMixedFraction(r2Frac)})`;
            stepDetails = {
              orig: `${lhsStr} ${inequalitySign} ${rhsStr}`,
              simplified: `${formatExpr(totalCoeff, 'x', 0)} ${inequalitySign} ${formatImproperFraction(createFraction(totalCoeff * boundaryFrac.n, boundaryFrac.d))}`,
              collected: null,
              isolated: `${formatExpr(totalCoeff, 'x', 0)} ${inequalitySign} ${formatImproperFraction(createFraction(totalCoeff * boundaryFrac.n, boundaryFrac.d))}`,
              coeff: totalCoeff
            };
          } else if (formType === 4) {
            a = getRandomChoice([5, 6, 7]);
            c = getRandomChoice([1, 2, 3, 4]);
            if (a === c) c += 1;
            let net = a - c;
            let r1 = getRandomInt(5, 12);
            let r2Frac = createFraction(r1 * boundaryFrac.d - net * boundaryFrac.n, boundaryFrac.d);
            lhsStr = `${formatExpr(a, 'x', 0)} - ${formatExpr(c, 'x', 0)}`;
            rhsStr = `${r1} - (${formatMixedFraction(r2Frac)})`;
            stepDetails = {
              orig: `${lhsStr} ${inequalitySign} ${rhsStr}`,
              simplified: `${formatExpr(net, 'x', 0)} ${inequalitySign} ${formatImproperFraction(createFraction(net * boundaryFrac.n, boundaryFrac.d))}`,
              collected: null,
              isolated: `${formatExpr(net, 'x', 0)} ${inequalitySign} ${formatImproperFraction(createFraction(net * boundaryFrac.n, boundaryFrac.d))}`,
              coeff: net
            };
          } else if (formType === 5) {
            a = getRandomChoice([-2, -1, 2, 3]);
            c = getRandomChoice([2, 4]);
            if (a + c === 0) c += 1;
            let net = a + c;
            b = getRandomInt(1, 6);
            rhsValFrac = createFraction(net * boundaryFrac.n + b * boundaryFrac.d, boundaryFrac.d);
            lhsStr = `${formatExpr(a, 'x', 0)} + ${b} + ${formatExpr(c, 'x', 0)}`;
            rhsStr = formatMixedFraction(rhsValFrac);
            stepDetails = {
              orig: `${lhsStr} ${inequalitySign} ${rhsStr}`,
              simplified: `${formatExpr(net, 'x', 0)} + ${b} ${inequalitySign} ${formatImproperFraction(rhsValFrac)}`,
              collected: `${formatExpr(net, 'x', 0)} ${inequalitySign} ${formatImproperFraction(rhsValFrac)} - ${b}`,
              isolated: `${formatExpr(net, 'x', 0)} ${inequalitySign} ${formatImproperFraction(createFraction(net * boundaryFrac.n, boundaryFrac.d))}`,
              coeff: net
            };
          } else {
            a = getRandomChoice([-3, -2, 1, 2]);
            c = getRandomChoice([-2, -1]);
            if (a + c === 0) a += 1;
            let net = a + c;
            b = getRandomInt(1, 6);
            rhsValFrac = createFraction(net * boundaryFrac.n - b * boundaryFrac.d, boundaryFrac.d);
            lhsStr = `${formatExpr(a, 'x', 0)} - ${b} ${c < 0 ? '-' : '+'} ${formatExpr(Math.abs(c), 'x', 0)}`;
            rhsStr = formatMixedFraction(rhsValFrac);
            stepDetails = {
              orig: `${lhsStr} ${inequalitySign} ${rhsStr}`,
              simplified: `${formatExpr(net, 'x', 0)} - ${b} ${inequalitySign} ${formatImproperFraction(rhsValFrac)}`,
              collected: `${formatExpr(net, 'x', 0)} ${inequalitySign} ${formatImproperFraction(rhsValFrac)} + ${b}`,
              isolated: `${formatExpr(net, 'x', 0)} ${inequalitySign} ${formatImproperFraction(createFraction(net * boundaryFrac.n, boundaryFrac.d))}`,
              coeff: net
            };
          }

          let netCoeff = stepDetails.coeff;
          let finalSign = inequalitySign;
          if (netCoeff < 0) {
            finalSign = reverseSign(inequalitySign);
          }

          let isClosed = (finalSign === '≥' || finalSign === '≤');
          let direction = (finalSign === '>' || finalSign === '≥') ? 'right' : 'left';

          const checkDen = getRandomChoice([2, 3, 5]);
          let offsetOptions = [-1.5, -1, -0.5, 0, 0.5, 1, 1.5];
          let pOffset = getRandomChoice(offsetOptions);
          let rawPVal = boundaryVal + pOffset;
          let pNum = Math.round(rawPVal * checkDen);
          let checkFrac = createFraction(pNum, checkDen);
          let checkValReal = checkFrac.n / checkFrac.d;

          let isCheckTrue = false;
          if (finalSign === '>') isCheckTrue = checkValReal > boundaryVal;
          else if (finalSign === '≥') isCheckTrue = checkValReal >= boundaryVal;
          else if (finalSign === '<') isCheckTrue = checkValReal < boundaryVal;
          else if (finalSign === '≤') isCheckTrue = checkValReal <= boundaryVal;

          let minVal = Math.floor(boundaryVal) - 3;
          let maxVal = Math.ceil(boundaryVal) + 3;

          return {
            type: 'B',
            inequalityStr: `${lhsStr} ${inequalitySign} ${rhsStr}`,
            boundaryFrac,
            boundaryVal,
            boundaryStr: formatMixedFraction(boundaryFrac),
            improperBoundaryStr: formatImproperFraction(boundaryFrac),
            finalSign,
            isClosed,
            direction,
            minVal,
            maxVal,
            checkFrac,
            checkStr: formatMixedFraction(checkFrac),
            checkAns: isCheckTrue ? 'Yes' : 'No',
            stepDetails
          };
        }
      }

      function renderInteractiveNumberLine() {
        const container = document.getElementById('nlInteractiveContainer');
        if (!container || !currentProblem || currentProblem.type !== 'B') return;

        let frac = studentBoundary !== null ? snapToFractionDen235(studentBoundary) : null;
        const state = {
          boundary: studentBoundary,
          boundaryFrac: frac,
          closed: studentClosed,
          direction: studentDirection
        };

        container.innerHTML = renderNumberLineSVG(currentProblem.minVal, currentProblem.maxVal, state, true);

        const svgEl = document.getElementById('interactiveNumberLineSVG');
        if (svgEl) {
          attachNumberLineEvents(svgEl);
        }
      }

      function attachNumberLineEvents(svgEl) {
        const viewBoxWidth = 500;
        const padding = 40;
        const count = currentProblem.maxVal - currentProblem.minVal;
        const stepWidth = (viewBoxWidth - 2 * padding) / count;

        function getValueFromX(clientX) {
          const rect = svgEl.getBoundingClientRect();
          const clickX = clientX - rect.left;
          const svgX = (clickX / rect.width) * viewBoxWidth;
          const clampedSvgX = Math.max(padding, Math.min(svgX, viewBoxWidth - padding));
          const rawVal = currentProblem.minVal + (clampedSvgX - padding) / stepWidth;
          const snappedFrac = snapToFractionDen235(rawVal);
          return snappedFrac.n / snappedFrac.d;
        }

        const circleEl = svgEl.querySelector('#boundaryCircle');

        svgEl.addEventListener('pointerdown', (e) => {
          if (isSubmitted || !currentProblem || currentProblem.type !== 'B') return;

          const clickedVal = getValueFromX(e.clientX);

          if (circleEl && (e.target === circleEl || e.target.closest('#boundaryCircle'))) {
            isDraggingBoundary = true;
            svgEl.setPointerCapture(e.pointerId);
            return;
          }

          if (studentBoundary === null) {
            studentBoundary = clickedVal;
            studentClosed = false;
            studentDirection = null;
          } else {
            const diff = Math.abs(clickedVal - studentBoundary);
            if (diff < 0.2) {
              studentClosed = !studentClosed;
            } else {
              if (clickedVal < studentBoundary) {
                studentDirection = 'left';
              } else if (clickedVal > studentBoundary) {
                studentDirection = 'right';
              }
            }
          }
          renderInteractiveNumberLine();
        });

        svgEl.addEventListener('pointermove', (e) => {
          if (!isDraggingBoundary || isSubmitted) return;
          const fineVal = getValueFromX(e.clientX);
          studentBoundary = fineVal;
          renderInteractiveNumberLine();
        });

        const handlePointerUp = (e) => {
          if (isDraggingBoundary) {
            isDraggingBoundary = false;
            try { svgEl.releasePointerCapture(e.pointerId); } catch(err){}
          }
        };

        svgEl.addEventListener('pointerup', handlePointerUp);
        svgEl.addEventListener('pointercancel', handlePointerUp);
      }

      function handleSubmit() {
        if (!currentProblem || isSubmitted) return;

        if (currentProblem.type === 'A') {
          const ans1 = document.getElementById('ansPart1').value;
          const ans2 = document.getElementById('ansPart2').value;
          const ans3 = document.getElementById('ansPart3').value;
          const ans4 = document.getElementById('ansPart4').value;

          if (!ans1 || !ans2 || !ans3 || !ans4) {
            alert("Please select inequality signs for all 4 parts before submitting.");
            return;
          }

          isSubmitted = true;
          disableInputsTypeA();

          const c1 = currentProblem.part1.correctSign;
          const c2 = currentProblem.part2.correctSign;
          const c3 = currentProblem.part3.correctSign;
          const c4 = currentProblem.part4.correctSign;

          const isAllCorrect = (ans1 === c1 && ans2 === c2 && ans3 === c3 && ans4 === c4);

          feedbackBox.style.display = 'block';

          if (isAllCorrect) {
            feedbackBox.className = 'feedback correct';
            feedbackBox.innerHTML = `Great job! All 4 parts are correct! 🎉`;
            if (window.recordCorrectSubmission) window.recordCorrectSubmission();
          } else {
            feedbackBox.className = 'feedback incorrect';
            let html = `<div class="feedback-heading">Incorrect. Here is the step-by-step solution:</div>`;

            const parts = [
              { label: '(a)', p: currentProblem.part1, user: ans1, corr: c1, var1: 'a', var2: 'b' },
              { label: '(b)', p: currentProblem.part2, user: ans2, corr: c2, var1: 'x', var2: 'y' },
              { label: '(c)', p: currentProblem.part3, user: ans3, corr: c3, var1: 'p', var2: 'q' },
              { label: '(d)', p: currentProblem.part4, user: ans4, corr: c4, var1: 'm', var2: 'n' }
            ];

            parts.forEach(pt => {
              const isPtCorr = (pt.user === pt.corr);
              const flipNote = pt.p.coeff < 0
                ? `Since we are multiplying/dividing by a <b>negative number (${pt.p.coeff})</b>, the inequality sign <b>flips</b> from <b>'${pt.p.givenSign}'</b> to <b>'${pt.p.correctSign}'</b>.`
                : `Since we are multiplying/dividing by a <b>positive number (${pt.p.coeff})</b>, the inequality sign <b>remains '${pt.p.correctSign}'</b>.`;

              html += `
                <div class="solution-line-block">
                  <div class="solution-line-title">
                    Part ${pt.label}: ${isPtCorr ? '<span style="color:#16a34a;">✓ Correct</span>' : '<span style="color:#dc2626;">✗ Incorrect</span>'}
                  </div>
                  <div><b>Given:</b> ${pt.var1} ${pt.p.givenSign} ${pt.var2}</div>
                  <div><b>Your Choice:</b> ${pt.user} &nbsp;|&nbsp; <b>Correct Sign:</b> ${pt.corr}</div>
                  <div class="math-working">${pt.p.expr1} <b>${pt.corr}</b> ${pt.p.expr2}</div>
                  <div style="margin-top:8px; font-size:0.9rem; color:#475569;">
                    <b>Explanation:</b> ${flipNote}
                  </div>
                </div>
              `;
            });

            feedbackBox.innerHTML = html;
          }

        } else {
          const ansSign = document.getElementById('ansSign').value;
          const ansBoundaryStr = document.getElementById('ansBoundary').value;

          if (!ansSign || !ansBoundaryStr.trim()) {
            alert("Please select the sign and type your boundary value in Step 1.");
            return;
          }

          const parsedStudentBoundary = parseMixedFraction(ansBoundaryStr);
          if (!parsedStudentBoundary) {
            alert("Please enter a valid fraction/mixed number for the boundary value (e.g. 2 1/3, -1/2, or 3).");
            return;
          }

          if (studentBoundary === null || !studentDirection) {
            alert("Please set boundary and arrow direction on the number line in Step 2.");
            return;
          }

          if (!studentCheckChoice) {
            alert("Please select Yes or No in Step 3.");
            return;
          }

          isSubmitted = true;
          disableInputsTypeB();

          const targetBoundaryVal = currentProblem.boundaryVal;
          const studentBoundaryVal = parsedStudentBoundary.n / parsedStudentBoundary.d;

          const isSignCorrect = (ansSign === currentProblem.finalSign);
          const isValueCorrect = Math.abs(studentBoundaryVal - targetBoundaryVal) < 0.001;

          const isGraphBoundaryCorrect = Math.abs(studentBoundary - targetBoundaryVal) < 0.15;
          const isGraphClosedCorrect = (studentClosed === currentProblem.isClosed);
          const isGraphDirectionCorrect = (studentDirection === currentProblem.direction);

          const isCheckCorrect = (studentCheckChoice === currentProblem.checkAns);

          const isStep1Correct = isSignCorrect && isValueCorrect;
          const isStep2Correct = isGraphBoundaryCorrect && isGraphClosedCorrect && isGraphDirectionCorrect;
          const isStep3Correct = isCheckCorrect;

          const isAllCorrect = isStep1Correct && isStep2Correct && isStep3Correct;

          feedbackBox.style.display = 'block';

          if (isAllCorrect) {
            feedbackBox.className = 'feedback correct';
            feedbackBox.innerHTML = `Great job! Your algebraic solution, number line graph, and value check are all perfectly correct! 🎉`;
            if (window.recordCorrectSubmission) window.recordCorrectSubmission();
          } else {
            feedbackBox.className = 'feedback incorrect';
            let html = `<div class="feedback-heading">Incorrect. Here is the step-by-step solution:</div>`;

            let step1Working = `Original:  ${currentProblem.stepDetails.orig}\n`;
            if (currentProblem.stepDetails.simplified) {
              step1Working += `Simplify:  ${currentProblem.stepDetails.simplified}\n`;
            }
            if (currentProblem.stepDetails.collected) {
              step1Working += `Collect:   ${currentProblem.stepDetails.collected}\n`;
            }
            if (currentProblem.stepDetails.isolated) {
              step1Working += `Isolate:   ${currentProblem.stepDetails.isolated}\n`;
            }

            if (currentProblem.stepDetails.coeff < 0) {
              step1Working += `Divide by ${currentProblem.stepDetails.coeff} (Negative! Flip sign):\n`;
            } else {
              step1Working += `Divide by ${currentProblem.stepDetails.coeff}:\n`;
            }

            if (currentProblem.boundaryFrac.d !== 1) {
              step1Working += `           x ${currentProblem.finalSign} ${currentProblem.improperBoundaryStr}\n`;
            }
            step1Working += `Final:     x ${currentProblem.finalSign} ${currentProblem.boundaryStr}`;

            html += `
              <div class="solution-line-block">
                <div class="solution-line-title">
                  Step 1: Algebraic Solution 
                  ${isStep1Correct ? '<span style="color:#16a34a;">✓ Correct</span>' : '<span style="color:#dc2626;">✗ Incorrect</span>'}
                </div>
                <div><b>Your Answer:</b> x ${ansSign} ${ansBoundaryStr}</div>
                <div><b>Correct Answer:</b> x ${currentProblem.finalSign} ${currentProblem.boundaryStr}</div>
                <div class="math-working">${step1Working}</div>
              </div>
            `;

            const correctGraphState = {
              boundary: currentProblem.boundaryVal,
              boundaryFrac: currentProblem.boundaryFrac,
              closed: currentProblem.isClosed,
              direction: currentProblem.direction
            };

            const correctSVG = renderNumberLineSVG(currentProblem.minVal, currentProblem.maxVal, correctGraphState, false);

            html += `
              <div class="solution-line-block">
                <div class="solution-line-title">
                  Step 2: Number Line Graph 
                  ${isStep2Correct ? '<span style="color:#16a34a;">✓ Correct</span>' : '<span style="color:#dc2626;">✗ Incorrect</span>'}
                </div>
                <div><b>Correct Graph Features:</b></div>
                <ul style="margin: 5px 0 10px 20px; padding: 0; font-size:0.95rem;">
                  <li>Boundary Point: <b>${currentProblem.boundaryStr}</b></li>
                  <li>Circle Type: <b>${currentProblem.isClosed ? 'Solid / Closed Circle (≥ or ≤)' : 'Open Circle (> or <)'}</b></li>
                  <li>Arrow Direction: <b>${currentProblem.direction === 'right' ? 'Points Right (Greater than)' : 'Points Left (Less than)'}</b></li>
                </ul>
                <div style="background: #f8fafc; padding: 10px; border-radius: 6px; border: 1px solid var(--border);">
                  <div style="font-weight: bold; font-size: 0.85rem; color: #475569; margin-bottom: 5px;">Correct Graph Visualization:</div>
                  ${correctSVG}
                </div>
              </div>
            `;

            html += `
              <div class="solution-line-block">
                <div class="solution-line-title">
                  Step 3: Check Value (x = ${currentProblem.checkStr}) 
                  ${isStep3Correct ? '<span style="color:#16a34a;">✓ Correct</span>' : '<span style="color:#dc2626;">✗ Incorrect</span>'}
                </div>
                <div><b>Your Choice:</b> ${studentCheckChoice} &nbsp;|&nbsp; <b>Correct Answer:</b> ${currentProblem.checkAns}</div>
                <div style="margin-top:8px; font-size:0.9rem; color:#475569;">
                  <b>Reasoning:</b> ${currentProblem.checkStr} <b>${currentProblem.checkAns === 'Yes' ? 'is' : 'is NOT'}</b> ${currentProblem.finalSign} ${currentProblem.boundaryStr}.
                </div>
              </div>
            `;

            feedbackBox.innerHTML = html;
          }

          populateStudentSummaryTypeB(ansSign, ansBoundaryStr);
        }

        undoDrawBtn.disabled = true;
        clearDrawBtn.disabled = true;
        canvas.classList.add('disabled');
        syncPrintImage();

        savePdfBtn.style.display = 'block';
      }

      function disableInputsTypeA() {
        ['ansPart1', 'ansPart2', 'ansPart3', 'ansPart4'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.disabled = true;
        });
        const sub = document.getElementById('submitBtn');
        if (sub) sub.disabled = true;
      }

      function disableInputsTypeB() {
        const signEl = document.getElementById('ansSign');
        const boundEl = document.getElementById('ansBoundary');
        const sub = document.getElementById('submitBtn');
        const resetNl = document.getElementById('resetNlBtn');
        const btnYes = document.getElementById('btnCheckYes');
        const btnNo = document.getElementById('btnCheckNo');

        if (signEl) signEl.disabled = true;
        if (boundEl) boundEl.disabled = true;
        if (sub) sub.disabled = true;
        if (resetNl) resetNl.disabled = true;
        if (btnYes) btnYes.disabled = true;
        if (btnNo) btnNo.disabled = true;
      }

      function populateStudentSummaryTypeB(ansSign, ansBoundaryStr) {
        studentAnswerSummary.innerHTML = `
          <div style="border: 1px solid var(--border); padding: 12px; border-radius: 8px; background: #ffffff;">
            <div style="color: var(--primary); font-size: 1.05rem; margin-bottom: 6px;">Student's Submitted Responses:</div>
            <div>• Step 1 Solution: <b>x ${ansSign} ${ansBoundaryStr}</b></div>
            <div>• Step 2 Graph: Boundary at <b>${studentBoundary !== null ? formatMixedFraction(snapToFractionDen235(studentBoundary)) : 'N/A'}</b>, Circle: <b>${studentClosed ? 'Solid' : 'Open'}</b>, Direction: <b>${studentDirection || 'N/A'}</b></div>
            <div>• Step 3 Check (x = ${currentProblem.checkStr}): <b>${studentCheckChoice}</b></div>
          </div>
        `;
      }

      savePdfBtn.addEventListener('click', () => {
        window.print();
      });
    });
  </script>
</body>
</html>
